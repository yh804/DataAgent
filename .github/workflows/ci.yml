name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: 单元测试
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 前端语法检查
        run: node --check web/static/app.js
